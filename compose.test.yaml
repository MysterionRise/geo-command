services:
  postgres:
    image: postgres:16.6-alpine3.21
    environment:
      POSTGRES_DB: codeguessr_test
      POSTGRES_PASSWORD: codeguessr_test
      POSTGRES_USER: codeguessr_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeguessr_test -d codeguessr_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
